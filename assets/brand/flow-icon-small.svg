<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Page Background & Outer Contrast Shadow -->
  <g id="page">
    <!-- Outer dark edge for contrast on light file-manager backgrounds -->
    <path d="M 254 98 L 654 98 L 846 290 L 846 850 A 76 76 0 0 1 770 926 L 254 926 A 76 76 0 0 1 178 850 L 178 174 A 76 76 0 0 1 254 98 Z"
          fill="none" stroke="rgba(0,0,0,0.35)" stroke-width="8" />
    
    <!-- Main page body with prominent 18px border for small icon sizes -->
    <path d="M 254 102 L 652 102 L 842 292 L 842 850 A 72 72 0 0 1 770 922 L 254 922 A 72 72 0 0 1 182 850 L 182 174 A 72 72 0 0 1 254 102 Z"
          fill="#0c0d12" stroke="rgba(255,255,255,0.22)" stroke-width="18" stroke-linejoin="round" />
  </g>

  <!-- Top-Right Folded Corner -->
  <g id="fold">
    <path d="M 652 102 L 652 292 L 842 292 Z" fill="#1a1c24" />
    <path d="M 652 102 L 842 292" stroke="rgba(255,255,255,0.35)" stroke-width="7" stroke-linecap="round" />
  </g>

  <!-- Centre Mark (Enlarged for small icons under 48px, perfectly centered) -->
  <g id="mark">
    <!-- Connecting path line -->
    <path d="M 330 450 L 512 512 L 694 584"
          fill="none" stroke="rgba(255,255,255,0.95)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Step 1 Circle -->
    <circle cx="330" cy="450" r="64" fill="rgba(255,255,255,0.95)" />

    <!-- Step 2 Circle -->
    <circle cx="512" cy="512" r="64" fill="rgba(255,255,255,0.95)" />

    <!-- Step 3 Circle (Execute / Run Target) -->
    <circle cx="694" cy="584" r="64" fill="rgba(255,255,255,0.95)" />

    <!-- Run Ring around Circle 3 -->
    <circle cx="694" cy="584" r="102" fill="none" stroke="rgba(255,255,255,0.50)" stroke-width="18" />
  </g>
</svg>
