name: 🐛 Bug Report
description: Report an issue, regression, or unexpected behavior in Cero
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please ensure you have checked existing issues in our [Roadmap & Issue Tracker](docs/TODO.md) before submitting.

  - type: dropdown
    id: platform
    attributes:
      label: Operating System
      description: What platform are you running Cero on?
      options:
        - macOS (Apple Silicon M1/M2/M3/M4)
        - macOS (Intel)
        - Windows 10 / 11
        - Linux (Ubuntu / Debian)
        - Linux (Arch / Fedora / Other)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Cero Version
      description: What version or commit of Cero are you using?
      placeholder: e.g. v0.1.0-alpha / commit a2af22e
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what went wrong.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step commands to reproduce the behavior.
      placeholder: |
        1. Open Cero
        2. Execute `>...` or run command `...`
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs & Output
      description: Please copy terminal output or error stack traces here.
      render: shell
