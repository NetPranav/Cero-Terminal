name: Release

# The Windows release, built from its own branch so it can be fixed and re-released on its own:
#   release/windows -> v<version>-windows  .msi and setup .exe
# The version comes from package.json. Re-running on the same branch replaces the assets.
on:
  push:
    branches: [ 'release/windows' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      platform: ${{ steps.v.outputs.platform }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "platform=${GITHUB_REF_NAME#release/}" >> "$GITHUB_OUTPUT"

  windows:
    needs: meta
    if: needs.meta.outputs.platform == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npx tauri build --bundles msi,nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  publish:
    needs: [meta, windows]
    # Runs once the Windows build job succeeded
    if: always() && needs.meta.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Collect installers and checksums
        run: |
          mkdir -p release
          # Only the installers, wherever the artifact download put them
          find assets -type f \( -name '*.msi' -o -name '*.exe' \) -exec cp {} release/ \;
          cd release
          # GitHub turns spaces in asset names into dots; name the files that way so SHA256SUMS matches
          for f in *\ *; do [ -e "$f" ] && mv "$f" "${f// /.}"; done
          ls -la
          [ -n "$(ls)" ] || { echo "No installers were built" >&2; exit 1; }
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.meta.outputs.version }}-${{ needs.meta.outputs.platform }}
          target_commitish: ${{ github.sha }}
          name: Cero ${{ needs.meta.outputs.version }} for Windows
          body_path: docs/releases/${{ needs.meta.outputs.platform }}.md
          files: release/*
          fail_on_unmatched_files: false
