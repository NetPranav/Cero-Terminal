name: Release

# One GitHub release per platform, each built from its own branch so a platform can be fixed and
# re-released on its own:
#   release/macos   -> v<version>-macos    Apple Silicon DMG (uploaded from a tested local build) + Intel DMG from CI
#   release/linux   -> v<version>-linux    Arch package built on Arch Linux, plus .deb, .rpm and .AppImage (Ubuntu 22.04)
#   release/windows -> v<version>-windows  .msi and setup .exe
# The version comes from package.json. Re-running on the same branch replaces the assets.
on:
  push:
    branches: [ 'release/macos', 'release/linux', 'release/windows' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      platform: ${{ steps.v.outputs.platform }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "platform=${GITHUB_REF_NAME#release/}" >> "$GITHUB_OUTPUT"

  macos-intel:
    needs: meta
    if: needs.meta.outputs.platform == 'macos'
    # Cross-compiled on Apple Silicon: GitHub no longer offers the macos-13 Intel runner
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-apple-darwin }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npx tauri build --target x86_64-apple-darwin --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-intel
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

  linux-arch:
    needs: meta
    if: needs.meta.outputs.platform == 'linux'
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Arch build dependencies
        run: pacman -Syu --noconfirm --needed base-devel git nodejs npm rust webkit2gtk-4.1 gtk3 librsvg binutils
      - uses: actions/checkout@v4
      - name: Build and package with packaging/arch/build-pacman.sh
        # makepkg refuses to run as root; the script builds the binary (linked against Arch's own
        # webkit2gtk-4.1), checks the embedded assets and packages it with makepkg
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE' && npm ci && bash packaging/arch/build-pacman.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arch
          path: src-tauri/target/release/bundle/pacman/*.pkg.tar.zst

  linux-debian:
    needs: meta
    if: needs.meta.outputs.platform == 'linux'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Build .deb, .rpm and .AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: npx tauri build --bundles deb,rpm,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-debian
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

  windows:
    needs: meta
    if: needs.meta.outputs.platform == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npx tauri build --bundles msi,nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  publish:
    needs: [meta, macos-intel, linux-arch, linux-debian, windows]
    # Runs once the platform's own build jobs succeeded (the other platforms' jobs are skipped)
    if: always() && needs.meta.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: |
          cd assets
          ls -la
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.meta.outputs.version }}-${{ needs.meta.outputs.platform }}
          target_commitish: ${{ github.sha }}
          name: Sentinel Terminal ${{ needs.meta.outputs.version }} for ${{ needs.meta.outputs.platform == 'macos' && 'macOS' || needs.meta.outputs.platform == 'linux' && 'Linux' || 'Windows' }}
          body_path: docs/releases/${{ needs.meta.outputs.platform }}.md
          files: assets/*
          fail_on_unmatched_files: false
