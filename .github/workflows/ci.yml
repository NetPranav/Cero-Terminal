name: Cero CI

# The windows branch builds Cero for Windows only. Windows runs the full checks; a Linux job runs the
# tests and the cross check developers use on Linux (cargo xwin), so both paths stay working.
on:
  push:
    branches: [ windows ]
  pull_request:
    branches: [ windows ]

jobs:
  frontend:
    name: Tests and production build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit and integration tests
        run: npm test

      - name: Type check and bundle
        run: npm run build

  backend:
    name: Rust check and tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri::generate_context! embeds frontendDist at compile time, so it must exist.
      - name: Placeholder frontend bundle
        shell: bash
        run: mkdir -p dist && echo '<!doctype html><title>ci</title>' > dist/index.html

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  linux-cross:
    name: Tests and cargo xwin check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit and integration tests
        run: npm test

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin

      # clang-cl, lld-link and the llvm tools (llvm-lib, llvm-rc, llvm-mt) that cargo-xwin and the
      # Windows resource compiler call
      - name: LLVM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
          echo "$(ls -d /usr/lib/llvm-* | sort -V | tail -1)/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: xwin

      - name: Placeholder frontend bundle
        run: mkdir -p dist && echo '<!doctype html><title>ci</title>' > dist/index.html

      - name: cargo xwin check
        run: cargo xwin check --target x86_64-pc-windows-msvc --manifest-path src-tauri/Cargo.toml
