name: Build installers

# Installers for testers: .dmg (Apple Silicon), .deb / .rpm / .AppImage (Linux x64),
# .msi / .exe (Windows x64). Download them from the run's "Artifacts" section.
on:
  push:
    branches: [ main, linux-v2-update ]
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
          - name: Linux x64
            os: ubuntu-22.04
          - name: Windows x64
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        env:
          # linuxdeploy (AppImage) cannot mount FUSE on the runner
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: cero-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 14
