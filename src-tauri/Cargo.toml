[package]
name = "cero-terminal"
version = "2.2.3"
description = "Cero: a terminal that takes requests in plain language and runs .flow files on any OS"
authors = ["Pranav Dubey (NetPranav)"]
license = "MIT"
repository = "https://github.com/NetPranav/Sentinal-Terminal"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cero-terminal"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
uuid = { version = "1.24.0", features = ["v4"] }
tokio = { version = "1.53.1", features = ["full"] }
once_cell = "1.21.4"
parking_lot = "0.12.5"
tauri-plugin-fs = "2.5.1"
tauri-plugin-os = "2.3.2"
tauri-plugin-process = "2.3.1"
tauri-plugin-shell = "2.3.5"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-http = "2.5.9"
sysinfo = "0.39.6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sha2 = "0.10"
tauri-plugin-single-instance = "2.5.2"
keyring = { version = "3", default-features = false, features = ["windows-native"] }
winreg = "0.55"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Globalization",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_NetworkManagement_IpHelper",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
